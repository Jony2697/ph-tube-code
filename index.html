<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .active {
            background-color: red;
            color: white;
        }
    </style>
</head>

<body>
    <!-- Navbar -->
    <header>
        <nav class="w-11/12 mx-auto flex justify-between border-b-2 border-gray-200 py-4">
            <div>
                <img src="assets/Logo.png" alt="">
            </div>
            <div>
                <label class="input">
                    <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <g stroke-linejoin="round" stroke-linecap="round" stroke-width="2.5" fill="none"
                            stroke="currentColor">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.3-4.3"></path>
                        </g>
                    </svg>
                    <input id="search-input" type="search" required placeholder="Search" />
                </label>
            </div>
            <div>
                <button class="btn">Sort by view</button>
            </div>
        </nav>
    </header>

    <!-- header -->
    <nav id="category-container" class="flex py-5 justify-center gap-5">
        <button id="btn-all" onclick="loadVideoes()" class="btn btn-sm ">All</button>

    </nav>

    <!-- videos section -->
    <section id="loadVideo-container"
        class="w-11/12 mx-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-10 py-5">

    </section>

    <!-- dynamic videos section -->
    <section id="loadCategory-container"
        class="w-11/12 mx-auto grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-10 py-5">

    </section>

    <!-- Open the modal using ID.showModal() method -->
    <!-- <button class="btn" onclick="my_modal_1.showModal()">open modal</button> -->
    <dialog id="video_details" class="modal">
        <div class="modal-box">
            <div id="details_container">

            </div>
            <div class="modal-action justify-center">
                <form method="dialog">
                    <!-- if there is a button in form, it will close the modal -->
                    <button class="btn ">Close ❌</button>
                </form>
            </div>
        </div>
    </dialog>


    <script src="index.js"></script>
</body>

</html>
